<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F3EE;--panel:#FFF;--line:#E8E4DC;--line2:#DCD7CD;--ink:#1B1A18;--ink2:#55524D;--ink3:#8B867E;
--coral:#E8543C;--coral-l:#F7D4CC;--coral-t:#FDEDE9;--coral-d:#8C2E1C;
--amber:#EBC44E;--amber-t:#FBF3DC;--amber-d:#8A6A12;--mint:#7FC79B;--mint-t:#E6F4EC;--mint-d:#2E7A52;
--blue:#A8C6E4;--blue-t:#EAF2F9;--blue-d:#2C5F8A;
--sans:"Greycliff CF","Sofia Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;

body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
.side{width:212px;flex:0 0 212px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-size:23px;font-weight:800;color:var(--coral);letter-spacing:-.03em;padding:0 7px;position:relative;display:inline-block}
.logo i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--coral);top:5px;right:0;font-style:normal}
.sub{font-size:10px;font-weight:700;color:var(--ink3);padding:1px 7px 14px;letter-spacing:.06em}
.scope{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;margin-bottom:14px}
.scope select{border:none;background:none;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);width:100%;outline:none;cursor:pointer}
.navsec{font-size:9.5px;font-weight:800;letter-spacing:.11em;color:var(--ink3);padding:12px 9px 5px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:12.5px;font-weight:600;margin-bottom:1px}
.nav a:hover{background:#FAF8F4}
.nav a.on{background:var(--coral-l);color:var(--coral-d)}
.nav a .ct{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;min-width:17px;text-align:center}
.nav a.on .ct{background:var(--coral-d)}
.nav a .ct.q{background:var(--ink3)}
.sfoot{margin-top:16px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.main{flex:1;min-width:0;padding:18px 24px 60px}
.hd{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.hdm{font-size:12px;color:var(--ink3);font-weight:600}
h2{font-size:13px;font-weight:800;letter-spacing:.02em;margin:22px 0 9px;text-transform:uppercase;color:var(--ink2)}
h2 span{font-weight:600;text-transform:none;color:var(--ink3);letter-spacing:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.grid{display:grid;gap:10px}
.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:1250px){.g6{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.g6,.g5,.g4,.g3,.g2{grid-template-columns:1fr 1fr}.side{display:none}}
.t{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.t .l{font-size:9.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.t .v{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:3px 0 1px}
.t .n{font-size:10.5px;color:var(--ink3)}
.t .v.r{color:var(--coral)}.t .v.g{color:var(--mint-d)}.t .v.a{color:var(--amber-d)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{background:#FAF8F4;text-align:right;padding:7px 9px;font-size:10px;color:var(--ink2);font-weight:700;line-height:1.25;vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
td{padding:7px 9px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;text-align:right;white-space:nowrap}
td:first-child{font-family:var(--sans);font-weight:700;font-size:12px}
.pos{color:var(--mint-d);font-weight:700}.neg{color:var(--coral);font-weight:700}
.f{display:inline-block;font-size:9px;font-weight:800;border-radius:4px;padding:2px 5px;font-family:var(--sans);letter-spacing:.02em}
.f.r{background:var(--coral-t);color:var(--coral-d)}.f.a{background:var(--amber-t);color:var(--amber-d)}
.f.g{background:var(--mint-t);color:var(--mint-d)}.f.b{background:var(--blue-t);color:var(--blue-d)}
.f.n{background:#F0EDE6;color:var(--ink3)}
/* weather */
#map{height:430px;border-radius:11px;border:1px solid var(--line);z-index:1}
.wwrap{display:grid;grid-template-columns:1fr 330px;gap:11px}
@media(max-width:1100px){.wwrap{grid-template-columns:1fr}}
.mapbar{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:11px 11px 0 0;flex-wrap:wrap}
#map.hasbar{border-radius:0 0 11px 11px}
.mbtn{border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--sans);color:var(--ink2)}
.mbtn:hover{border-color:var(--ink3)}.mbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mts{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto}
.risk{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;max-height:474px;overflow-y:auto}
.rk{border:1px solid var(--line);border-left:3px solid var(--ink3);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.rk:hover{background:#FBFAF7}
.rk.act{border-left-color:var(--coral);background:var(--coral-t)}
.rk.wat{border-left-color:var(--amber);background:var(--amber-t)}
.rk .n{font-size:12.5px;font-weight:800}
.rk .d{font-size:11px;color:var(--ink2);margin-top:2px}
.rk .m{font-size:10.5px;color:var(--ink3);margin-top:3px;font-family:var(--mono)}
.leg{display:flex;gap:11px;flex-wrap:wrap;font-size:10.5px;color:var(--ink3);margin-top:7px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;font-style:normal;vertical-align:middle}
/* decisions */
.dec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--coral);border-radius:9px;padding:10px 12px;margin-bottom:7px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.dec.a{border-left-color:var(--amber)}.dec.b{border-left-color:var(--blue)}.dec.done{border-left-color:var(--mint);opacity:.65}
.dec .q{font-size:13px;font-weight:700;line-height:1.35}
.dec .s{font-size:11px;color:var(--ink3);margin-top:2px;font-family:var(--mono)}
.bt{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.b{border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--sans);color:var(--ink2);white-space:nowrap}
.b:hover{border-color:var(--ink3)}.b.p{background:var(--coral);border-color:var(--coral);color:#fff}
.b.g{background:var(--mint-t);border-color:#BEDFCB;color:var(--mint-d)}
.row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.row:last-child{border:none}
.row .k{flex:0 0 250px;font-weight:700}
.row .v{flex:1;color:var(--ink2)}
.row .n{flex:0 0 130px;text-align:right;font-family:var(--mono);font-weight:800;font-size:12px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bn{flex:0 0 96px;font-size:11.5px;color:var(--ink2);text-align:right}
.btr{display:block;flex:1;height:15px;background:#EFECE5;border-radius:3px;overflow:hidden}
.bf{display:block;height:100%;border-radius:3px}
.bv{flex:0 0 86px;font-family:var(--mono);font-size:11.5px;font-weight:700}
.mx{width:100%;border-collapse:separate;border-spacing:4px;background:none;border:none}
.mx th{background:none;padding:2px 4px;text-align:center;font-size:10px;color:var(--ink2)}
.mx th:first-child{text-align:left;width:96px}
.mx td{border:none;padding:0;background:none}
.cell{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 5px;text-align:center;cursor:pointer;background:var(--panel)}
.cell:hover{transform:translateY(-1px)}
.cell .s{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.cell .m{font-family:var(--mono);font-size:11.5px;font-weight:700;margin-top:1px}
.cell.ok{background:var(--mint-t);border-color:#BEDFCB}.cell.ok .s{color:var(--mint-d)}
.cell.no{background:var(--coral-t);border-color:var(--coral-l)}.cell.no .s{color:var(--coral-d)}
.cell.na{background:#F7F5F1;border-style:dashed}.cell.na .s{color:var(--ink3)}
.cell.ex{background:var(--blue-t);border-color:#C6DCEE}.cell.ex .s{color:var(--blue-d)}
.mxl{font-size:11.5px;font-weight:700;color:var(--ink2);text-align:right}
.cal{width:100%;border-collapse:separate;border-spacing:3px;background:none;border:none}
.cal th{background:none;font-size:9.5px;color:var(--ink3);padding:1px;text-align:center;font-weight:700}
.cal th:first-child{text-align:left;width:86px}
.cal td{border:none;padding:0;background:none}
.slot{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--ink3);text-align:center;line-height:1.05;padding:2px}
.slot.std{background:var(--coral-t);border-color:var(--coral-l);color:var(--coral-d)}
.slot.prod{background:var(--blue-t);border-color:#C6DCEE;color:var(--blue-d)}
.slot.lnch{background:var(--amber-t);border-color:#EADFBE;color:var(--amber-d)}
.slot.over{background:var(--coral);border-color:var(--coral);color:#fff}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:900px){.pipe{grid-template-columns:1fr 1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px}
.stage h4{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:7px}
.item{border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:6px;background:#FDFCFA}
.item .n{font-size:12px;font-weight:700;line-height:1.25}
.item .d{font-size:10.5px;color:var(--ink3);margin-top:2px}
.ctl{margin-bottom:11px}
.ctl label{display:block;font-size:9.5px;font-weight:800;color:var(--ink3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.ctl .r{display:flex;align-items:center;gap:8px}
.ctl input[type=range]{flex:1;accent-color:var(--coral)}
.ctl .rv{font-family:var(--mono);font-size:12px;font-weight:700;min-width:52px;text-align:right}
select,input[type=number],input[type=text]{padding:6px 8px;border:1px solid var(--line2);border-radius:7px;font-family:var(--sans);font-size:12px;background:var(--panel);color:var(--ink);width:100%}
.math{background:#FAF8F4;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:var(--mono);font-size:11.5px;line-height:1.85}
.math .lab{color:var(--ink3);font-family:var(--sans)}
.rec{background:var(--ink);color:#fff;border-radius:10px;padding:13px 15px;margin-bottom:10px}
.rec .l{font-size:9.5px;font-weight:800;color:#9A948B;text-transform:uppercase;letter-spacing:.05em}
.rec .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.rec .n{font-size:11.5px;color:#B5AFA6}
.rec .d{font-size:11.5px;margin-top:7px;padding-top:7px;border-top:1px solid #3A3733;color:#EDE9E1}
.model{display:grid;grid-template-columns:250px 1fr;gap:14px}

.chartbox{position:relative;height:210px}
.note{font-size:10.5px;color:var(--amber-d);background:var(--amber-t);border:1px solid #EADFBE;border-radius:7px;padding:6px 9px;margin-top:8px}
.ban{background:var(--mint-t);border:1px solid #BEDFCB;color:var(--mint-d);border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-bottom:10px}
/* ask */
.fab{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;background:var(--coral);border:none;cursor:pointer;box-shadow:0 6px 20px rgba(27,26,24,.26);z-index:900;display:flex;align-items:center;justify-content:center}

.pnh{padding:12px 14px;border-bottom:1px solid #3A3733;display:flex;align-items:center;gap:8px}

.pb{flex:1;overflow-y:auto;padding:13px 14px}
.pf{padding:10px 11px;border-top:1px solid #3A3733}
.pf .r{display:flex;gap:6px}
.pf input{flex:1;background:#2A2825;border:1px solid #454239;border-radius:8px;padding:9px 12px;color:#fff;font-size:12.5px;font-family:var(--sans);width:auto}
.pf input:focus{outline:none;border-color:var(--coral)}
.pf button{background:var(--coral);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:#2A2825;border:1px solid #454239;color:#C6C1B8;border-radius:7px;padding:4px 8px;font-size:10.5px;cursor:pointer}
.chip:hover{border-color:var(--coral);color:#fff}
.hello{color:#8B857C;font-size:11.5px;margin-bottom:9px;line-height:1.45}
.ans{background:#252320;border:1px solid #3A3733;border-radius:10px;padding:11px 12px;margin-bottom:8px;color:#EDE9E1;font-size:12.5px}
.ans .a{margin-bottom:6px;line-height:1.5}.ans .a b{color:#fff}
.ans .do{color:#FFB4A2;font-size:12px;margin-bottom:6px;line-height:1.4}
.ans .src{color:#8B857C;font-size:10px;font-family:var(--mono);line-height:1.4}
.ans a{color:var(--coral);font-weight:700;text-decoration:none;font-size:11.5px}
.ans table{background:none;border:none;margin:5px 0}
.ans td{border-top:1px solid #3A3733;color:#EDE9E1;font-size:11px;padding:4px 6px}
.ans td:first-child{color:#B5AFA6;font-family:var(--sans)}
.you{background:var(--coral);color:#fff;border-radius:10px 10px 3px 10px;padding:7px 11px;margin:0 0 8px auto;font-size:12.5px;max-width:82%;width:fit-content}
.leaflet-container{font-family:var(--sans)}
.pin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}

function ptIn(pt,poly){ // ray cast, [lng,lat] ring
let x=pt[0],y=pt[1],inside=false;
for(let i=0,j=poly.length-1;i<poly.length;j=i++){
const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside}
return inside}
function alertsAt(lat,lng){
const hits=[];
for(const f of ALERTS){const g=f.geometry; if(!g)continue;
const polys = g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
for(const p of polys){ if(p[0]&&ptIn([lng,lat],p[0])){hits.push(f.properties);break} }}
return hits}
let SIMC=[39.9,-75.0], SIMR=1.6; // storm cell, dropped wherever you are looking
function simRing(){return Array.from({length:24},(_,i)=>{const a=i/24*2*Math.PI;
return [SIMC[1]+SIMR*1.3*Math.cos(a), SIMC[0]+SIMR*Math.sin(a)]})}
function inSim(lat,lng){return SIM&&ptIn([lng,lat],simRing())}

...Object.keys(HUBGEO).map(h=>({id:h,type:'Hub',name:h,city:HUBGEO[h][2],lat:HUBGEO[h][0],lng:HUBGEO[h][1],
vol:0,region:'Network',fac:'Veho'}))];
for(const f of all){
const a=alertsAt(f.lat,f.lng), sim=inSim(f.lat,f.lng);
let lvl='clear',why='No active alert',ev='';
if(sim){lvl='act';why='Simulated severe cell overhead';ev='Simulated'}
else if(a.length){
const worst=a.find(x=>x.severity==='Extreme')||a.find(x=>x.severity==='Severe')||a[0];
ev=worst.event; lvl=(worst.severity==='Extreme'||worst.severity==='Severe')?'act':'wat'; why=worst.event}

function qq(s){document.getElementById('q').value=s;ask()}
function push(h){const pb=document.getElementById('pb');pb.insertAdjacentHTML('beforeend',h);pb.scrollTop=pb.scrollHeight}
function out(a,d,src,l){push(`<div class="ans"><div class="a">${a}</div>${d?`<div class="do">${d}</div>`:''}${src?`<div class="src">${src}</div>`:''}${l?`<div style="margin-top:5px"><a href="#/${l}" onclick="tp()">Open ${l} &rarr;</a></div>`:''}</div>`)}
function tbl(rows){return `<table>${rows.map(r=>`<tr><td>${r[0]}</td><td style="text-align:right;font-family:var(--mono)">${r[1]}</td></tr>`).join('')}</table>`}
const METRICS={
'on-time':['otd','%',k=>f1(M[k].otd)+'%'],'otd':['otd','%',k=>f1(M[k].otd)+'%'],
'driver wait':['ci_med','min',k=>M[k].ci_med+' min'],'wait':['ci_med','min',k=>M[k].ci_med+' min'],
'bad morning':['ci_p90','min',k=>M[k].ci_p90+' min'],'p90':['ci_p90','min',k=>M[k].ci_p90+' min'],
'quit':['aband','/10k',k=>M[k].aband+' per 10k'],'abandon':['aband','/10k',k=>M[k].aband+' per 10k'],
'handling':['hand','/10k',k=>M[k].hand+' per 10k'],'rework':['rework','%',k=>M[k].rework+'%'],
'uph':['uph','',k=>M[k].uph],'packages per hour':['uph','',k=>M[k].uph],'productivity':['uph','',k=>M[k].uph],
'volume':['vol','',k=>fm(M[k].vol)+'/day'],'inbound':['dep_sd','min',k=>M[k].dep_sd+' min swing'],
'freight':['arr_late','%',k=>Math.round(100-M[k].arr_late)+'% on time'],'route':['raband','%',k=>M[k].raband+'%']};
function ask(){
const box=document.getElementById('q'),raw=box.value.trim(),q=raw.toLowerCase(); if(!q)return;
push(`<div class="you">${raw}</div>`); box.value='';
let mks=[...q.matchAll(/(?:market|mkt|site)\s+([a-h])\b/g)].map(m=>m[1].toUpperCase());
// a bare capital B-H is almost always a market. 'A' is skipped, it is usually the article.
for(const m of raw.matchAll(/\b([B-H])\b/g)) if(!mks.includes(m[1])) mks.push(m[1]);
mks=mks.filter(x=>AZ.includes(x));
const mk=mks[0];
const hub=(q.match(/hub[\s-]?([1-5])/)||[])[1];
const di=['mon','tue','wed','thu','fri','sat','sun'].findIndex(d=>q.includes(d));
const metric=Object.keys(METRICS).find(m=>q.includes(m));
// weather
if(/\bweather|\bstorm|\brain\b|\bsnow|radar|\balert|forecast for|wind|flood/.test(q)){
const hit=WXRISK.filter(f=>f.lvl!=='clear');
if(!WXRISK.length) return out('The weather layer has not loaded yet. Open Today and it fetches live radar and National Weather Service alerts.',null,null,'today');
if(!hit.length) return out('<b>No active alerts over any site.</b> Radar is live and all 8 markets and 5 hubs are clear.','Nothing to do. The trigger rules run against National Weather Service alert polygons, so this updates itself.',null,'today');
return out(`<b>${hit.length} sites flagged</b>, ${hit.filter(f=>f.lvl==='act').length} at action level.`+
tbl(hit.slice(0,6).map(f=>[f.name+' · '+f.city,f.why])),
hit.some(f=>f.type==='Hub')?'A hub is affected, so every destination on that hub is exposed. Pull departures forward.':'Hold launch 30 minutes at action sites and brief drivers.','Live NWS alert polygons · RainViewer radar','today')}
// comparison
if(mks.length>=2){const [a,b]=mks;
return out(`<b>Market ${a} vs Market ${b}</b>`+tbl([
['On-time',`${f1(M[a].otd)}% vs ${f1(M[b].otd)}%`],['Driver wait',`${M[a].ci_med} vs ${M[b].ci_med} min`],
['Quitting routes',`${M[a].aband} vs ${M[b].aband} /10k`],['Handling',`${M[a].hand} vs ${M[b].hand} /10k`],
['Packages/hour',`${M[a].uph} vs ${M[b].uph}`],['Rework',`${M[a].rework}% vs ${M[b].rework}%`],
['Freight on time',`${Math.round(100-M[a].arr_late)}% vs ${Math.round(100-M[b].arr_late)}%`],
['Type',`${M[a].fac} vs ${M[b].fac}`]]),null,'Daily OTD · Launch Ops · Middle Mile','network')}
// metric, for one market or across the network
if(metric&&mk){const [key,unit,fmt]=METRICS[metric];
const good=['otd','uph'].includes(key);
const rank=AZ.slice().sort((a,b)=>good?M[b][key]-M[a][key]:M[a][key]-M[b][key]).indexOf(mk)+1;
const best=AZ.slice().sort((a,b)=>good?M[b][key]-M[a][key]:M[a][key]-M[b][key])[0];
return out(`<b>Market ${mk}</b> · ${metric}: <b>${fmt(mk)}</b>, ranked <b>${rank} of 8</b>. Best is Market ${best} at ${fmt(best)}.`,
null,'Computed from the raw tables','network')}
if(metric){const [key,unit,fmt]=METRICS[metric];
const good=['otd','uph'].includes(key);
const sorted=AZ.slice().sort((a,b)=>good?M[b][key]-M[a][key]:M[a][key]-M[b][key]);
return out(`<b>${metric} across the network</b>, best first`+tbl(sorted.map(k=>['Market '+k,fmt(k)])),
null,'Computed from the raw tables','network')}
// which hub, no number given
if(/hub/.test(q)&&!hub){const d=mk||'G';
const hs=Object.keys(S.hub2).sort((a,b)=>S.hub2[b][d][0]-S.hub2[a][d][0]);
return out(`<b>Freight leaving each hub for Market ${d}</b>, worst first`+
tbl(hs.map(h=>[h,`${S.hub2[h][d][0]} min late · ${S.hub2[h][d][1]} min swing`])),
d==='G'?'Every hub, not one. That is why the fix is a standard on all five and not a conversation with one hub lead.':null,
'Middle Mile: actual_departure vs sdt','inbound')}
if(hub){const h='Hub-'+hub, g=S.hub2[h]['G'], o=AZ.filter(k=>k!=='G').reduce((a,k)=>a+S.hub2[h][k][0],0)/7;
return out(`<b>${h}</b> sends G-bound freight out <b>${g[0]} minutes late</b> with ${g[1]} minutes of swing, across ${g[2]} trips. Everything else from this hub leaves ${f1(o)} minutes late.`,
g[0]>15?'This hub is part of the G problem. It belongs in the weekly inbound review.':'This hub is not the issue.','Middle Mile: actual_departure vs sdt','inbound')}
if(mk&&(di>=0||/associate|staff|head|crew/.test(q))){const m=M[mk],i=di>=0?di:0,v=m.dow[i][0],h=v/UPHSTD;
return out(`Market ${mk} projects <b>${fm(v)} packages</b> on ${S.dow[i]}. At ${f1(UPHSTD)} that is <b>${fm(h)} hours</b>, <b>${Math.ceil(h/SHIFT)} associates</b>.`,
m.rework>15?`${m.rework}% of hours go to rework against a 13-15% band. Some of those associates cover a defect.`:'Set the ramp share on the plan page if any of the shift is new.','Day-of-week history · 42 days','plan')}
if(/decision|waiting|today|desk/.test(q)){const o=DEC.filter(d=>!DONE[d.id]);
return out(o.length?`<b>${o.length} waiting.</b>`+tbl(o.map(d=>[d.q.slice(0,54),d.s.split('·')[0]])):'<b>Nothing waiting.</b>',
o.length?'Take the change cap ones first. F is the largest market in the network.':null,null,'today')}
if(/sla|past due|overdue|queue|ticket|escalat/.test(q)){
const br=TIX.filter(t=>t.st!=='closed'&&t.age>SLA[t.p]);
return out(`<b>${openT()} open</b>, ${TIX.filter(t=>t.p===1&&t.st!=='closed').length} at P1, ${br.length} past SLA.`+
tbl(TIX.filter(t=>t.st!=='closed').slice(0,5).map(t=>['P'+t.p+' '+t.id+' Mkt '+t.mk,t.sum.slice(0,38)])),
br.length?`${br[0].id} is ${br[0].age-SLA[br[0].p]} minutes past. It is Market ${br[0].mk}.`:null,'Escalation queue','queue')}
if(/trainer|certif|training|learn/.test(q)){
const none=AZ.filter(k=>!TRAINERS[k]);
return out(`<b>${AZ.filter(k=>TRAINERS[k]>0).length} of 8 markets have a certified trainer.</b>`+
tbl(AZ.map(k=>['Market '+k,`${CERT.hq[k]}% certified · ${TRAINERS[k]} trainer${TRAINERS[k]===1?'':'s'}`])),
none.length?`Market ${none.join(', ')} has none. Publishing a standard there achieves nothing until a trainer is certified.`:null,'Illustrative. No training data in the dataset','learn')}
if(/change cap|change load|calendar|over the cap|too much change/.test(q)){
return out(`<b>${capB()} markets over the cap.</b> One change per market per six weeks.`,
capB()?'Market F has the scan rollout and a site move a week apart. Market D has two three weeks apart.':'Everything inside budget.','Change calendar','change')}
if(/launch|expansion|new market|ramp/.test(q)){
return out(`<b>${PIPE.length} in flight.</b>`+tbl(PIPE.map(p=>[p.n+' · '+p.st,'wk '+p.wk+' · ramp ends '+(p.wk+8)])),
'Two ramps finish inside peak. Go-live is not the risk, the eight week ramp is.','Illustrative pipeline','expand')}
if(/plan|rate|standard rate|uph standard|publish/.test(q)){
const below=AZ.filter(k=>M[k].uph<UPHSTD).length;
return out(`The published rate is <b>${f1(UPHSTD)} UPH</b>, plan v${PUBS[PUBS.length-1].v}, published ${PUBS[PUBS.length-1].d}. <b>${below} of 8</b> markets run below it.`,
'Move the slider on the plan page and publish. Every page re-rates.','Launch Ops: launched ÷ labor hours','plan')}
if(/adopt|standard/.test(q)){
return out(`<b>Handling Quality</b> is the only standard at GA. ${AZ.filter(k=>M[k].hand<60).length} of 8 markets clear its bar. Route Readiness is in alpha at two sites, Inbound is drafting, Escalation has no telemetry yet.`,
'A market is never marked red for a standard it was never given.','Standards adoption','standards')}
if(/owe|promise|reciproc|our sla/.test(q)){
return out('<b>What we owe the field</b>'+tbl(OWED.map(o=>[o[0],o[1]])),
'Freight on time is ours with Transportation and it is our worst number.',null,'today')}
if(/\bteam\b|overload|my people|who owns|who is on/.test(q)){
return out('<b>Team load</b>'+tbl(TEAM.map(t=>[t[0],t[3]])),
'The product interface is blocked on the route-ready scan event. That is the one that decides whether Standard 2 ships on a proxy.','My judgement, not a system field','today')}
if(/\bwhy\b|root cause|what is wrong|driving/.test(q)&&mk){
const m=M[mk];
if(mk==='G') return out('<b>Market G is not failing inside its own walls.</b> Only <b>'+Math.round(100-m.arr_late)+'% of its inbound freight arrives on time</b> against 93 to 95% everywhere else, and that causes 66% of its misses. Trucks leave the hub <b>24 minutes late into G against 7 elsewhere</b>, at all five hubs. The drive itself is normal: 45.6 minutes faster than plan into G, 45.3 everywhere else. Inside the building G is unremarkable, 12 minute driver wait and 98% on-time launch.',
'Standard on hub departure swing, weekly inbound review run by hub instead of by market, and a standard for recovery trucks. Not a conversation with Market G.','Middle Mile joined to Daily OTD, 5,641 trips','inbound');
if(mk==='D') return out('<b>Market D is failing inside its own walls.</b> Drivers wait <b>'+m.ci_med+' minutes</b> from check in to first load against 12 network. Check in itself is 3 minutes at D and 3 minutes everywhere, so it is the window after it. Drivers quitting routes cause 66% of D\u2019s misses, '+m.aband+' per 10,000 against 131. The wait grew every week: 23, 26, 36, 41, 44, 54. D pushed its launch 22 of 42 days and on those days the wait was worse, not better.',
'Route Readiness, driver wait into the daily check, and a reason code on every pushed launch. No counterparty needed, which is why it goes first.','Launch Ops joined to Daily OTD, 42 days','standards');
const w=[['inbound freight',100-m.arr_late<88],['driver wait',m.ci_med>20],['handling',m.hand>100],['rework',m.rework>18]].filter(x=>x[1]);
return out('<b>Market '+mk+'</b> at '+f1(m.otd)+'% on-time. '+(w.length?'What breaks: <b>'+w.map(x=>x[0]).join(', ')+'</b>.':'Nothing in this market breaks a control limit. It is not on the at-risk list.'),null,'Raw tables','network')}
if(/worst|risk|failing|problem/.test(q)){
return out(`<b>Market G at ${f1(M['G'].otd)}%</b> is last, and the cause is not in the building: only ${Math.round(100-M['G'].arr_late)}% of its inbound freight arrives on time against 93 to 95% everywhere else. <b>Market D at ${f1(M['D'].otd)}%</b> is failing inside its own walls, drivers waiting ${M['D'].ci_med} minutes against 12 network.`,
'Take D first. It needs no counterparty. G needs five hub leads and Transportation in a room.','Daily OTD · Launch Ops · Middle Mile','network')}
if(/best|scale|copy|good/.test(q)){
return out(`<b>Market E at ${f1(M['E'].otd)}%</b> on outcome, <b>Market B</b> on practice. B pushed a launch zero times in 42 days and its worst morning was ${M['B'].ci_max} minutes.`,
'Scale B’s staging sequence, not B’s outcome. B sits 7th of 8 on inbound freight.','Launch Ops','network')}
if(/region|southeast|northeast|west\b|central|geograph|map|where are/.test(q)){
const rs=[...new Set(AZ.map(k=>M[k].region))].sort();
return out('<b>The network by region</b>'+tbl(rs.map(r=>{const mk=AZ.filter(k=>M[k].region===r);
return [r,mk.map(k=>'Mkt '+k).join(', ')+' · '+fm(mk.reduce((a,k)=>a+M[k].vol,0))+'/day']})),
'The Southeast holds the best market in the network and the worst. Region does not explain performance, so I do not manage by it.','Market roster','today')}
if(/3pl|contract|partner/.test(q)){
const t=AZ.filter(k=>M[k].fac==='3PL');
return out(`<b>${t.length} of 8 sites are 3PL</b> (${t.map(k=>'Market '+k).join(', ')}), a third of volume and 55% of every missed package. Half of that is freight we deliver to them late.`,
'No reporting line. The levers are volume allocation, which works now, and the data feed at renewal.','Daily OTD by facility_type','network')}
if(mk){const m=M[mk],f=STD.filter(s=>s.stage==='GA'&&s.test(mk)===false);
return out(`<b>Market ${mk}</b> · ${m.fac} · ${m.region}`+tbl([
['On-time',f1(m.otd)+'%'],['Driver wait',m.ci_med+' min'],['Quitting routes',m.aband+' /10k'],
['Handling',m.hand+' /10k'],['Packages/hour',m.uph],['Rework',m.rework+'%'],
['Freight on time',Math.round(100-m.arr_late)+'%'],['Trainers',TRAINERS[mk]],
['Open tickets',TIX.filter(t=>t.mk===mk&&t.st!=='closed').length]]),
f.length?`Below the bar on ${f.map(s=>s.short).join(' and ')}.`:'Clears every shipped standard.','Raw tables','network')}
return out('I do not have that.',null,
'I can answer on: any market or pair of markets, any hub, on-time, driver wait, quitting routes, handling, packages per hour, rework, inbound freight, weather and alerts, the plan and the rate, staffing for a day, standards and adoption, trainers and certification, the change cap, launches and ramp, the escalation queue and SLA, the team, 3PLs, and what we owe the field. No cost, headcount, or capacity data exists in the workbook.')}
route();
</script></body></html>
