<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veho Central Operations</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>


*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F3EE;--panel:#FFF;--panel2:#FAF8F4;--line:#E8E4DC;--line2:#DCD7CD;
--ink:#1B1A18;--ink2:#55524D;--ink3:#7A756D;
/* Veho Orange. Their rebrand post says twice that it is orange, not red. */
--coral:#E84931;--coral-l:#F7D4CC;--coral-t:#FDEDE9;--coral-d:#8C2E1C;
--amber:#EBC44E;--amber-t:#FBF3DC;--amber-d:#8A6A12;--mint:#7FC79B;--mint-t:#E6F4EC;--mint-d:#2E7A52;
--blue:#A8C6E4;--blue-t:#EAF2F9;--blue-d:#2C5F8A;
--sans:"Greycliff CF","Sofia Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
.side{width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logorow{display:flex;align-items:center;gap:8px}
.obhelp{width:19px;height:19px;border-radius:999px;border:1px solid var(--line2);background:none;color:var(--ink3);
 font-family:var(--sans);font-size:11px;font-weight:800;line-height:1;cursor:pointer;padding:0;display:grid;place-items:center;flex:0 0 auto}
.obhelp:hover{border-color:var(--coral);color:var(--coral)}
.logo{font-size:23px;font-weight:800;color:var(--coral);letter-spacing:-.03em;padding:0 7px;position:relative;display:inline-block}
.logo i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--coral);top:5px;right:0;font-style:normal}
.sub{font-size:10px;font-weight:700;color:var(--coral);padding:1px 7px 14px;letter-spacing:.06em;line-height:1.45}
.login{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.login.gone{display:none}
.loginbox{max-width:940px;width:100%}
.loginbox2{max-width:392px;width:100%;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:38px 34px 30px}
.signbtn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);margin-top:22px}
.signbtn:hover{background:var(--coral)}
.loginh{font-size:25px;font-weight:800;letter-spacing:-.025em;margin:0 0 5px}
.logind{font-size:12.5px;color:var(--ink3);line-height:1.5}
.loginf{font-size:11.5px;color:var(--ink3);margin-top:16px;text-align:center}
.seatgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:900px){.seatgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.seatgrid{grid-template-columns:1fr}}
.seatcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;cursor:pointer;text-align:left;font-family:var(--sans);display:flex;flex-direction:column}
.seatcard:hover{border-color:var(--coral)}
.seatcard .dept{font-size:9px;font-weight:800;letter-spacing:.07em;color:var(--coral);text-transform:uppercase}
.seatcard .rn{font-size:15px;font-weight:800;margin:5px 0 2px;letter-spacing:-.01em}
.seatcard .rw{font-size:11.5px;color:var(--ink3);margin-bottom:9px}
.seatcard .rl{font-size:12px;color:var(--ink2);line-height:1.45;flex:1}
.seatcard .rs{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}
.seatbox{border:1px solid var(--ink);background:var(--ink);border-radius:8px;padding:7px 9px;margin-bottom:8px}
.seatl{font-size:8.5px;font-weight:800;letter-spacing:.09em;color:#8B857C;margin-bottom:3px}
.seatbox select{border:none;background:none;font-family:var(--sans);font-size:12.5px;font-weight:700;color:#fff;width:100%;outline:none;cursor:pointer}
.seatbox select option{color:var(--ink)}
.seatw{font-size:10px;color:#B5AFA6;margin-top:3px;line-height:1.35}
.scope{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;margin-bottom:14px}
.scope select{border:none;background:none;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);width:100%;outline:none;cursor:pointer}
.navsec{font-size:9.5px;font-weight:800;letter-spacing:.11em;color:var(--ink3);padding:12px 9px 5px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:12.5px;font-weight:600;margin-bottom:1px}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--coral-l);color:var(--coral-d)}
.nav a .ct{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;min-width:17px;text-align:center}
.nav a.on .ct{background:var(--coral-d)}
.nav a .ct.q{background:var(--ink3)}
.sfoot{margin-top:auto;padding-top:11px;border-top:1px solid var(--line);background:var(--panel)}
.who{display:flex;align-items:center;gap:9px;padding:7px 6px 4px}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 31px}
.whon{font-size:12px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whor{font-size:10.5px;color:var(--ink3);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewtog{margin-left:auto;background:none;border:none;color:var(--ink3);cursor:pointer;font-size:13px;padding:2px 4px}
.viewpick{display:none;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.viewpick.open{display:block}
.viewpick .vh{font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--ink3);padding:8px 10px 5px}
.viewpick button{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:8px 10px;font-family:var(--sans);font-size:11.5px;color:var(--ink2);cursor:pointer}
.viewpick button:hover{background:var(--panel2);color:var(--ink)}
.viewpick button.on{color:var(--coral-d);font-weight:700;background:var(--coral-t)}
.viewpick button i{display:block;font-style:normal;font-size:10px;color:var(--ink3);margin-top:1px}
.main{flex:1;min-width:0;padding:18px 24px 60px}
.hd{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
@media(max-width:1400px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px;position:relative;overflow:hidden}
.kpi .kl{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.03em}
.kpi .kv{font-size:29px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin:5px 0 2px;font-variant-numeric:tabular-nums}
.kpi .kv.r{color:var(--coral)}.kpi .kv.a{color:var(--amber-d)}.kpi .kv.g{color:var(--mint-d)}
.kpi .kd{font-size:10.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.kpi .spark{position:absolute;right:10px;bottom:9px;opacity:.85}
.up{color:var(--mint)}.down{color:var(--coral)}
/* alert queue */
.alerts{display:flex;flex-direction:column;gap:7px}
.al{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:9px;padding:10px 12px;cursor:pointer}
.al:hover{background:var(--panel2)}
.al.on{border-color:var(--coral);background:var(--panel2)}
.al.p1{border-left-color:var(--coral)}.al.p2{border-left-color:var(--amber)}.al.p3{border-left-color:var(--blue)}.al.p4{border-left-color:var(--line2)}
.al .ah{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.al .at{font-size:12.5px;font-weight:700;line-height:1.35;margin-bottom:4px}
.al .am{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.al .ago{margin-left:auto;font-size:10px;color:var(--ink3);font-family:var(--mono)}
/* right detail drawer */
.dwrap{display:grid;grid-template-columns:1fr 372px;gap:12px;align-items:start}
@media(max-width:1250px){.dwrap{grid-template-columns:1fr}}
.drw{background:var(--panel);border:1px solid var(--line);border-radius:11px;position:sticky;top:14px;overflow:hidden}
.drwh{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.drwt{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.drwt button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 10px;font-size:11.5px;font-weight:700;color:var(--ink3);cursor:pointer;font-family:var(--sans)}
.drwt button.on{color:var(--ink);border-bottom-color:var(--coral)}
.drwb{padding:13px 14px;max-height:none}
.sect{font-size:9px;font-weight:800;letter-spacing:.07em;color:var(--ink3);text-transform:uppercase;margin:14px 0 6px}
.sect:first-child{margin-top:0}
.drv{display:grid;grid-template-columns:1fr 92px 34px;gap:8px;align-items:center;font-size:11.5px;color:var(--ink2);margin-bottom:5px}
.drvbar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.drvbar i{display:block;height:100%;background:var(--coral);border-radius:3px}
.imp3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.imp3 div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.imp3 .il{font-size:9px;color:var(--ink3);font-weight:700}
.imp3 .iv{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.qa{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
/* bottom ask bar */
.askbar{position:fixed;left:216px;right:0;bottom:0;background:linear-gradient(180deg,rgba(245,243,238,0) 0%,var(--bg) 34%);padding:16px 24px 14px;z-index:800}
.askin{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:8px 10px}
.askin input{flex:1;background:none;border:none;color:var(--ink);font-family:var(--sans);font-size:13px;outline:none;width:auto}
.askin .go{background:var(--ink);border:none;border-radius:8px;width:32px;height:32px;color:#fff;font-size:15px;cursor:pointer}
.askchips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.askchips button{background:var(--panel);border:1px solid var(--line);color:var(--ink2);border-radius:99px;padding:5px 11px;font-size:11px;cursor:pointer;font-family:var(--sans)}
.askchips button:hover{border-color:var(--coral);color:var(--ink)}
@media(max-width:800px){.askbar{left:0}}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.hdm{font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.02em}
.seatban{background:var(--ink);color:#EDE9E1;border-radius:8px;padding:7px 12px;font-size:11.5px;margin-bottom:12px}
.seatban b{color:#fff}
.hdr{font-size:11px;color:var(--ink3);margin-left:auto;font-family:var(--mono)}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--mint-d);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
h2{font-size:12px;font-weight:800;letter-spacing:.04em;margin:20px 0 8px;text-transform:uppercase;color:var(--ink2)}
h2 span{font-weight:600;text-transform:none;color:var(--ink3);letter-spacing:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.grid{display:grid;gap:10px}
.g6{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:1250px){.g6{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.g6,.g5,.g4,.g3,.g2{grid-template-columns:1fr 1fr}}
/* ---- phones and small tablets: the rail becomes a top bar ---- */
@media(max-width:800px){
 body{flex-direction:column}
 .side{width:auto;flex:0 0 auto;height:auto;position:sticky;top:0;z-index:900;
  border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;
  flex-direction:row;align-items:center;gap:10px;overflow:visible}
 .side .sub,.side .sfoot{display:none}
 .side .logo{font-size:19px;padding:0 2px;flex:0 0 auto}
 .side .nav{flex:1 1 auto!important;min-width:0;display:flex;gap:6px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .side .nav::-webkit-scrollbar{display:none}
 .nav a{flex:0 0 auto;margin-bottom:0;padding:7px 11px;font-size:12.5px;white-space:nowrap;
  border:1px solid var(--line);background:var(--bg)}
 .nav a.on{border-color:transparent}
 .nav a .ct{margin-left:6px}
 .main{padding:14px 13px 90px;max-width:100vw}
 .tkh,.tkl{grid-template-columns:50px 1fr 84px!important}
 .tkh>span:not(:first-child):not(:nth-child(2)):not(:last-child),
 .tkl>span:not(:first-child):not(:nth-child(2)):not(:last-child){display:none}
 .vchart{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
 .vgrid{grid-auto-columns:66px}
 .vsub{font-size:9.5px}
 .nwrap{padding:12px}
 .nwcard{max-height:88vh;overflow-y:auto}
}
.t{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.t .l{font-size:9px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.t .v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:3px 0 1px}
.t .n{font-size:10.5px;color:var(--ink3)}
.t .v.r{color:var(--coral)}.t .v.g{color:var(--mint-d)}.t .v.a{color:var(--amber-d)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{background:var(--panel2);text-align:right;padding:7px 9px;font-size:10px;color:var(--ink2);font-weight:700;line-height:1.25;vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
td{padding:7px 9px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;text-align:right;white-space:nowrap}
td:first-child{font-family:var(--sans);font-weight:700;font-size:12px}
.pos{color:var(--mint-d);font-weight:700}.neg{color:var(--coral);font-weight:700}
.f{display:inline-block;font-size:9px;font-weight:800;border-radius:4px;padding:2px 5px;font-family:var(--sans);letter-spacing:.02em}
.f.r{background:var(--coral-t);color:var(--coral-d)}.f.a{background:var(--amber-t);color:var(--amber-d)}
.f.g{background:var(--mint-t);color:var(--mint-d)}.f.b{background:var(--blue-t);color:var(--blue-d)}
.f.n{background:#F0EDE6;color:var(--ink3)}
/* weather */
#map{height:392px;border-radius:11px;border:1px solid var(--line);z-index:1}
.wwrap{display:block}
.riskrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:8px;margin-top:9px}
.riskclear{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-top:9px;font-size:12.5px;flex-wrap:wrap}
.mapbar{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:11px 11px 0 0;flex-wrap:wrap}
#map.hasbar{border-radius:0 0 11px 11px}
.mbtn{border:1px solid var(--line2);background:var(--panel2);border-radius:7px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--sans);color:var(--ink2)}
.mbtn:hover{border-color:var(--ink3)}.mbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mts{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto}
.risk{margin-top:0}
.rk{border:1px solid var(--line);border-left:3px solid var(--ink3);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.rk:hover{background:var(--panel2)}
.rk.act{border-left-color:var(--coral);background:var(--coral-t)}
.rk.wat{border-left-color:var(--amber);background:var(--amber-t)}
.rk .n{font-size:12.5px;font-weight:800}
.rk .d{font-size:11px;color:var(--ink2);margin-top:2px}
.rk .m{font-size:10.5px;color:var(--ink3);margin-top:3px;font-family:var(--mono)}
.leg{display:flex;gap:11px;flex-wrap:wrap;font-size:10.5px;color:var(--ink3);margin-top:7px}
.wxrec{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:9px;background:var(--panel2)}
.dh2{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.wxr{font-size:11.5px;color:var(--ink2);line-height:1.45;margin-bottom:5px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;font-style:normal;vertical-align:middle}
/* decisions */
.dec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:9px;padding:10px 12px;margin-bottom:7px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.dec.r{border-left-color:var(--coral)}.dec.a{border-left-color:var(--amber)}.dec.b{border-left-color:var(--blue)}.dec.done{border-left-color:var(--mint);opacity:.65}
.src{font-size:10px;color:var(--ink3);font-family:var(--mono)}
.dec .q{font-size:13px;font-weight:700;line-height:1.35}
.dec .s{font-size:11px;color:var(--ink3);margin-top:2px;font-family:var(--mono)}
.bt{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.br{display:grid;grid-template-columns:186px 1fr 58px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.br:last-of-type{border-bottom:0}
.bkt{display:block;height:14px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bkt i{display:block;height:100%;background:var(--amber);border-radius:3px;min-width:2px}
.bn{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink)}
@media(max-width:800px){.br{grid-template-columns:1fr 74px 52px}}
.b{border:1px solid var(--line2);background:var(--panel2);border-radius:7px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--sans);color:var(--ink2);white-space:nowrap}
.b:hover{border-color:var(--ink3)}.b.p{background:var(--coral);border-color:var(--coral);color:#fff}
.b.g{background:var(--mint-t);border-color:#BEDFCB;color:var(--mint-d)}
.row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.row:last-child{border:none}
.row .k{flex:0 0 250px;font-weight:700}
.row .v{flex:1;color:var(--ink2)}
.row .n{flex:0 0 130px;text-align:right;font-family:var(--mono);font-weight:800;font-size:12px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bn{flex:0 0 96px;font-size:11.5px;color:var(--ink2);text-align:right}
.btr{display:block;flex:1;height:15px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bf{display:block;height:100%;border-radius:3px}
.bv{flex:0 0 86px;font-family:var(--mono);font-size:11.5px;font-weight:700}
.mx{width:100%;border-collapse:separate;border-spacing:4px;background:none;border:none}
.mx th{background:none;padding:2px 4px;text-align:center;font-size:10px;color:var(--ink2)}
.mx th:first-child{text-align:left;width:96px}
.mx td{border:none;padding:0;background:none}
.cell{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 5px;text-align:center;cursor:pointer;background:var(--panel)}

/* ---------- the lane standard ---------- */
function spec(k){
 const m=MK[k], S=sim(k);
 const vans=S.routes.filter(r=>r.cls==='lg').length;
 const lg=Math.max(4,Math.ceil(vans/TURNS));
 const std=Math.ceil((m.rt-vans)/TURNS);
 return {vans, vanPct:100*vans/m.rt, lg, std, total:lg+std,
  lanesStd:Math.ceil(std/8), lanesLg:Math.ceil(lg/8)};
}
const PERLANE=8;
function lanes(k){
 const sp=spec(k), c=MK[k].conf, out=[]; const ids='ABCDEFGH';
 let s=sp.std, g=sp.lg;
 if(c==='nolg'){ s=sp.std+sp.lg; g=0; }          // no dedicated oversize positions
 if(c==='short'){ s=Math.round(sp.std*.78); }    // built short of the standard
 const nl=Math.max(1,Math.ceil(s/PERLANE));      // split evenly rather than filling then a stub
 let i=0, left=s;
 for(let L=0;L<nl;L++){const n=Math.round(left/(nl-L)); out.push({id:ids[i++],n,cls:'std'}); left-=n}
 if(g>0) out.push({id:ids[i++],n:g,cls:'lg'});
 return out;
}
function slotList(k){ const out=[];
 lanes(k).forEach(l=>{for(let i=1;i<=l.n;i++) out.push({id:l.id+i,lane:l.id,no:i,cls:l.cls})});
 return out }

/* ================= STAGING ENGINE =================
   auto  = roll the cart whose driver arrives soonest
   fifo  = roll whatever finished sorting first, which is what a floor does by hand */
const HOLD={};   /* slots the floor has taken out of the pool */
const PIN={};    /* routeId -> slotId, set by hand on the floor. The engine plans around them. */
const SCH={};
function holdKey(k){return Object.keys(HOLD[k]||{}).filter(s=>HOLD[k][s]).sort().join(',')}
function pinKey(k){const p=PIN[k]||{};return Object.keys(p).sort().map(r=>r+'>'+p[r]).join(',')}
function sch(k){const key=k+'|auto|'+holdKey(k)+'|'+pinKey(k);
 return SCH[key]||(SCH[key]=stage(k,'auto',HOLD[k]||{},PIN[k]||{}))}
function unsequenced(k){const key=k+'|fifo|'+holdKey(k)+'|'+pinKey(k);
 return SCH[key]||(SCH[key]=stage(k,'fifo',HOLD[k]||{},PIN[k]||{}))}
function toggleHold(k,sid){HOLD[k]=HOLD[k]||{};HOLD[k][sid]=!HOLD[k][sid];TOURC=null;draw()}
function clearHolds(k){delete HOLD[k];TOURC=null;draw()}
function assignTo(k,rid,sid){if(!rid||!sid)return;TOURC=null;PIN[k]=PIN[k]||{};
 for(const r in PIN[k]) if(PIN[k][r]===sid) delete PIN[k][r];   /* one route per slot */
 PIN[k][rid]=sid; draw()}
function unpinSlot(k,sid){TOURC=null;const p=PIN[k]||{};for(const r in p) if(p[r]===sid) delete p[r]; draw()}
function clearPins(k){delete PIN[k];TOURC=null;draw()}
function pinnedTo(k,sid){const p=PIN[k]||{};for(const r in p) if(p[r]===sid) return r; return null}

function stage(k,mode,holds,pins){
 holds=holds||{}; pins=Object.assign({},pins||{});
 const S=sim(k);
 const R=S.routes.map(r=>{const c=S.carts.find(x=>x.rid===r.id);
  return Object.assign({},r,{ready:c?c.ce:SORTW.e,roll:null,slot:null,scanIn:null,scanOut:null,pen:0})});
 const byId={}; R.forEach(r=>byId[r.id]=r);
 const live=R.filter(r=>!r.unclaimed);
 const slots=slotList(k).filter(s=>!holds[s.id]).map(s=>Object.assign({},s,{free:SHIFT.s,occ:[],blocks:[]}));
 const held=slotList(k).filter(s=>holds[s.id]).map(s=>Object.assign({},s,{free:SHIFT.e+1,occ:[],blocks:[],held:true}));
 const pos={}; slots.forEach((s,i)=>pos[s.id]=i);
 const hasLg=slots.some(s=>s.cls==='lg');
 const live_={}; slots.forEach(s=>live_[s.id]=1);
 const pinFor={}; for(const r in pins) if(live_[pins[r]]) pinFor[pins[r]]=r; else delete pins[r];
 let blocked=0, oversizeInStd=0;

 for(let t=SHIFT.s;t<=SHIFT.e;t++){
  /* eligible: sorted, not yet rolled, and the driver is close enough to be worth the position */
 let q=live.filter(r=>r.roll===null&&r.ready<=t&&r.arr<=t+AHEAD);
  if(!q.length) continue;
  q.sort(mode==='auto' ? (a,b)=>a.arr-b.arr||a.ready-b.ready : (a,b)=>a.ready-b.ready||a.arr-b.arr);
  for(const s of slots){
   if(s.free>t) continue;
   let pick=-1, over=false;
   /* a slot somebody pinned by hand waits for its route and takes nothing else */
   const owner=pinFor[s.id];
   if(owner){
    const pi=q.findIndex(r=>r.roll===null&&r.id===owner);
    if(pi<0) continue;
    pick=pi; over=(q[pi].cls==='lg'&&s.cls==='std');
    if(over){const nb=slots[pos[s.id]+1]; if(!(nb&&nb.lane===s.lane&&nb.free<=t)) continue}
   } else {
    const freeR=r=>r.roll===null&&!pins[r.id];
    if(s.cls==='lg'){
     pick=q.findIndex(r=>freeR(r)&&r.cls==='lg');
     if(pick<0) pick=q.findIndex(r=>freeR(r)&&r.cls==='std');
    }else{
     pick=q.findIndex(r=>freeR(r)&&r.cls==='std');
     if(pick<0&&!hasLg){
      const i2=q.findIndex(r=>freeR(r)&&r.cls==='lg');
      const nb=slots[pos[s.id]+1];
      if(i2>=0&&nb&&nb.lane===s.lane&&nb.free<=t){pick=i2;over=true}
     }
    }
   }
   if(pick<0) continue;
   const r=q[pick];
   r.roll=t; r.slot=s.id; r.scanIn=Math.max(t,r.arr);
   r.pen=over?6:0; r.scanOut=r.scanIn+r.dur+r.pen;
   s.free=r.scanOut; s.occ.push(r.id);
   if(over){oversizeInStd++;
    const nb=slots[pos[s.id]+1];
    if(nb&&nb.lane===s.lane){nb.free=r.scanOut;nb.blocks.push({from:t,to:r.scanOut,by:r.id});blocked++}}
  }

 const turns=staged.length/Math.max(1,slots.length);
 const holdMin=staged.reduce((a,r)=>a+Math.max(0,r.scanIn-r.roll),0);   // slot held with no driver
 const waitMin=staged.reduce((a,r)=>a+Math.max(0,r.scanIn-r.arr),0);    // driver waiting with no slot
 return {R,byId,live,slots:slots.concat(held),blocked,oversizeInStd,hasLg,held:held.length,pins,
  never:live.filter(r=>r.roll===null).length,
  turns, holdMin, waitMin, staged:staged.length};
}

/* ---------- states ---------- */
function rstate(r,t){
 if(r.unclaimed) return 'unclaimed';
 if(t<r.cin) return 'pending';
 if(t<r.arr) return 'appOnly';
 if(r.scanIn===null||t<r.scanIn) return 'waiting';
 if(t<r.scanOut) return 'loading';
 return 'departed';
}
const STL={pending:'Not checked in',appOnly:'Checked in, not here',waiting:'On site, waiting',
 loading:'In a slot, loading',departed:'Departed',unclaimed:'Unclaimed'};
function dwell(r,t){return rstate(r,t)==='waiting'?Math.max(0,t-r.arr):0}
function lvl(m){return m>=20?'r':m>=10?'a':'g'}
function slotAt(k,sid,t){
 const S=sch(k), s=S.slots.find(x=>x.id===sid);
 if(!s) return {st:'empty'};
 for(const rid of s.occ){const r=S.byId[rid];
  if(r&&r.roll<=t&&t<r.scanOut) return {st:t<r.scanIn?'staged':'loading',r,s,pinned:(S.pins||{})[r.id]===sid}}
 for(const b of s.blocks) if(b.from<=t&&t<b.to) return {st:'blocked',by:b.by,s};
 if(s.held) return {st:'held',s};
 return {st:'empty',s};
}
/* what the floor is holding right now */
function board(k,t){
 const S=sch(k);
 const st={pending:0,appOnly:0,waiting:0,loading:0,departed:0,unclaimed:0};
 S.R.forEach(r=>st[rstate(r,t)]++);
 const slots=S.slots.map(s=>Object.assign({id:s.id,lane:s.lane,no:s.no,cls:s.cls},slotAt(k,s.id,t)));
 const empty=slots.filter(x=>x.st==='empty').length;
 const stagedS=slots.filter(x=>x.st==='staged').length;
 const loadS=slots.filter(x=>x.st==='loading').length;
 const blockS=slots.filter(x=>x.st==='blocked').length;
 /* carts sorted and waiting for a slot */
 const queue=S.live.filter(r=>r.ready<=t&&(r.roll===null||r.roll>t)).sort((a,b)=>a.arr-b.arr);
 /* of those, the ones the engine will actually place inside the staging window */
 /* drivers here with nowhere to go yet */
 const waiting=S.live.filter(r=>rstate(r,t)==='waiting').sort((a,b)=>b.arr*-1-a.arr*-1||a.arr-b.arr);
 const lgSlots=slots.filter(x=>x.cls==='lg');
 const lgFree=lgSlots.filter(x=>x.st==='empty').length;
 const due=queue.filter(r=>r.arr<=t+30).length;
 return {st,slots,empty,stagedS,loadS,blockS,queue,waiting,lgSlots,lgFree,due,
  total:slots.length, util:Math.round(100*(stagedS+loadS+blockS)/Math.max(1,slots.length))};
}
function summ(k,t){

 const cs={wait:0,active:0,done:0,stall:0,miss:0}; C.forEach(c=>cs[cstate(c,t)]++);
 const open=tickets(k).filter(x=>x.t<=t&&x.t>t-95);
 const mis=open.filter(x=>!x.ok).length;
 return {st:b.st,red,amb,cs,open,misrouted:mis,board:b,
  lvlLaunch:red>=6?'r':red>=2?'a':'g',
  lvlSort:cs.stall>=12?'r':cs.stall>=5?'a':'g',
  lvlEsc:mis>=3?'r':mis>=1?'a':'g'};
}

function calcPrio(routes,total,wa,kd){
 const share=100*routes/total;
 let p = share>=20?1 : share>=8?2 : share>=2?3 : 4;
 if(!wa) p=Math.max(1,p-1);
 if(kd.force) p=kd.force;
 return p;
}
function prioWhy(x,p){
 p=p||x.p;
 const share=100*x.routes/MK[x.mk].rt;
 if(KD[x.kind].force&&p===KD[x.kind].force) return 'Forced to P1. This class of fault stops the building.';
 if(KD[x.kind].force) return 'Normally forced to P1 because this class of fault stops the building. Overridden to '+PRIOS[p-1].n+' on this shift.';
 return f1(share)+'% of routes affected'+(x.wa?', workaround in place':', no workaround')+
  ' → '+PRIOS[p-1].n+'. '+PRIOS[p-1].d+'.';
}

function tres(id){TOVR[id]=TOVR[id]||{};if(!TOVR[id].ack)TOVR[id].ack=T;TOVR[id].res=T;draw()}
function treopen(id){if(TOVR[id])delete TOVR[id].res;draw()}
function sopFix(id){TOVR[id]=TOVR[id]||{};TOVR[id].sop='resolved';TOVR[id].sopT=T;draw()}

let TIXC=null;
function allTix(){
 if(TIXC)return TIXC.concat(USERTIX);
 const out=[]; let seq=1041;
 MKT.forEach(m=>{
  const R=rng(m.seed*137), n=7+Math.floor(R()*6);
  for(let i=0;i<n;i++){
   const kd=TKIND[Math.floor(R()*TKIND.length)];
   const t=SORTW.s+30+Math.floor(R()*(SHIFT.e-SORTW.s-90));
   const routes=1+Math.floor(R()*Math.max(2,Math.round(m.rt*.24)));
   const wa=kd.wa?R()<.7:false;
   const p=calcPrio(routes,m.rt,wa,kd);
   const sla=PRIOS[p-1].sla;
   const site=kd.own==='site';
   const sopDone=t+7+Math.floor(R()*22);          /* worked through the SOP */
   const escd=site && R()<.19;                     /* the SOP did not clear it */
   const nocT=site?sopDone:t;
   const ack=nocT+Math.round(sla*(.28+R()*1.25));
   const res=ack+Math.round(sla*(.7+R()*2.2));
   const wrong=R() < (m.std==='live'?.14 : m.std==='pilot'?.3 : .5);
   const raisedTeam=wrong?TEAMS[Math.floor(R()*TEAMS.length)]:kd.team;
   out.push({id:(site?'SITE-':'NOC-')+(seq++), mk:m.k, kind:kd.k, title:kd.t,
    own:kd.own, team:kd.team, raisedTeam, ok:raisedTeam===kd.team,
    p, sla, t, nocT, sopDone, escd, ack, res, routes, wa,
    by:FN[Math.floor(R()*FN.length)]+' '+LNM[Math.floor(R()*LNM.length)],
    role:ROLES[Math.floor(R()*ROLES.length)],
    tried:wa?'Followed the workaround and kept the wave moving.':'Nothing clears it from the floor.'});
  }});
 out.sort((a,b)=>a.t-b.t); TIXC=out; return out.concat(USERTIX);
}
function tx(x){const o=TOVR[x.id]||{};
 return {ack:o.ack!==undefined?o.ack:x.ack, res:o.res!==undefined?o.res:x.res,
  team:o.team||x.team, p:o.p||x.p, sla:PRIOS[(o.p||x.p)-1].sla,
  sop:o.sop||null, sopT:o.sopT}}
/* site item: open while the SOP is being worked, then resolved on site or escalated */
function sstate(x,t){const v=tx(x);
 if(x.mine){ if(v.sop) return v.sop; return x.escd?'escalated':'open' }
 if(t<x.t) return 'future';
 if(v.sop) return t<v.sopT?'open':v.sop;
 if(t<x.sopDone) return 'open';
 return x.escd?'escalated':'resolved';
}
function escAt(x){const v=tx(x); return v.sop?v.sopT:x.sopDone}
/* does it sit in the NOC queue at all */
function inNoc(x,t){ if(x.mine) return x.own==='central'?true:sstate(x,t)==='escalated';
 if(x.own==='central') return t>=x.t;
 return sstate(x,t)==='escalated' }
function nocT(x){ return x.own==='central'?x.t:escAt(x) }
function tstate(x,t){const v=tx(x), n=nocT(x);
 if(x.mine){ if(!inNoc(x,t)) return 'future'; const o=TOVR[x.id]||{};
  return o.res!==undefined?'resolved':(o.ack!==undefined?'open':'new') }
 if(!inNoc(x,t)) return 'future';
 if(t<Math.max(v.ack,n)) return 'new';
 if(t<v.res) return 'open';
 return 'resolved'}
function tbreach(x,t){const v=tx(x), st=tstate(x,t), n=nocT(x);
 if(x.mine) return false;
 if(st==='future') return false;
 if(st==='new') return (t-n)>v.sla;
 return (v.ack-n)>v.sla}
function tickets(k){return allTix().filter(x=>x.mk===k)
 .map(x=>({t:x.t,title:x.title,raised:x.raisedTeam,own:x.team,ok:x.ok,kind:x.kind,p:x.p,lane:x.own}))}

function vRec(){
 const k=SEL, t=T, f=forecast(k,t), B=board(k,t), S=sch(k);
 const at=f.arr.length, wait=B.waiting.length;
 if(f.gap<=0) return '<div class="rec ok'+foc('squeeze')+'">'+
  '<div class="recic">✓</div><div style="flex:1">'+
  '<div class="rech">No squeeze in the next '+f.win+' minutes</div>'+
  '<div class="recb"><b>'+at+'</b> driver'+(at===1?'':'s')+' inside the geofence, <b>'+wait+'</b> waiting on the floor, '+
   '<b>'+(f.sup.std+f.sup.lg)+'</b> position'+(f.sup.std+f.sup.lg===1?'':'s')+' free or clearing. Supply covers it.</div></div>'+
  '<div class="recn"><span>'+(f.sup.std+f.sup.lg-f.dem.std-f.dem.lg)+'</span><i>spare</i></div></div>';

 /* what actually clears it, with the slots named */
 const acts=[];
 if(f.parked.length){
  const n=Math.min(f.gap,f.parked.length,8), sl=f.parked.slice(0,n);
  const ids=sl.slice(0,6).map(x=>x.id).join(', ')+(n>6?' and '+(n-6)+' more':'');
  acts.push(['Pull back '+n+' staged cart'+(n===1?'':'s')+' · '+ids,
   'Their drivers are still '+Math.round(sl[sl.length-1].r.arr-t)+'+ minutes out. Returning these to the queue frees '+
   n+' position'+(n===1?'':'s')+' now and covers '+Math.min(100,Math.round(100*n/f.gap))+'% of the gap.']);
 }
 if(f.gStd>0 && f.sup.lg-f.dem.lg>0){
  const n=Math.min(f.gStd,f.sup.lg-f.dem.lg);
  acts.push(['Open the oversize lane to '+n+' standard route'+(n===1?'':'s'),
   'Lane '+(B.lgSlots[0]?B.lgSlots[0].lane:'—')+' has '+(f.sup.lg-f.dem.lg)+' spare position'+(f.sup.lg-f.dem.lg===1?'':'s')+
   ' and no oversize route waiting on it. Standard routes fit an oversize bay.']);
 }
 if(f.gLg>0){
  acts.push(['Oversize is the binding constraint',
   f.dem.lg+' oversize route'+(f.dem.lg===1?'':'s')+' against '+f.sup.lg+' oversize position'+(f.sup.lg===1?'':'s')+'. '+
   (S.hasLg?'Hold the oversize wave and launch standard first.':'This building has no dedicated oversize lane, which is the root cause.')]);
 }
 const nextW=WAVES.find(w=>w.t>t);
 if(nextW&&f.gap>3) acts.push(['Stagger the next wave',
  'Move '+Math.min(f.gap,12)+' drivers from wave '+nextW.n+' ('+hm(nextW.t)+') to '+hm(nextW.t+20)+'. The floor cannot absorb them at '+hm(nextW.t)+'.']);
 if(!acts.length) acts.push(['Nothing frees in time',
  'Every position is committed and no cart can be pulled back. '+f.gap+' driver'+(f.gap===1?'':'s')+' will wait. Log the minutes to indirect.']);

 return '<div class="rec bad'+foc('squeeze')+'">'+
  '<div class="recic hot">!</div><div style="flex:1">'+
  '<div class="rech">Slot squeeze in the next '+f.win+' minutes · '+f.gap+' driver'+(f.gap===1?'':'s')+' will wait</div>'+
  '<div class="recb"><b>'+at+'</b> inside the geofence and <b>'+wait+'</b> already on the floor against <b>'+
   (f.sup.std+f.sup.lg)+'</b> position'+(f.sup.std+f.sup.lg===1?'':'s')+' free or clearing'+
   (f.gLg>0?' · oversize short by '+f.gLg:'')+'.</div>'+
  '<div class="recacts">'+acts.map((a,i)=>'<div class="reca"><span class="recno">'+(i+1)+'</span>'+
   '<span><b>'+a[0]+'</b><i>'+a[1]+'</i></span></div>').join('')+'</div>'+
  '</div><div class="recn hot"><span>'+f.gap+'</span><i>will wait</i></div></div>';
}

/* events straight off the schedule, newest first */
function events(k,t,win){
 const S=sch(k), out=[];
 S.R.forEach(r=>{
  if(r.unclaimed)return;
  if(r.arr>t-win&&r.arr<=t)                        out.push({t:r.arr,ty:'arr',r});
  if(r.roll!==null&&r.roll>t-win&&r.roll<=t)       out.push({t:r.roll,ty:'roll',r});
  if(r.scanIn!==null&&r.scanIn>t-win&&r.scanIn<=t) out.push({t:r.scanIn,ty:'in',r});
  if(r.scanOut!==null&&r.scanOut>t-win&&r.scanOut<=t)out.push({t:r.scanOut,ty:'out',r});
 });
 const ord={out:0,in:1,roll:2,arr:3};
 out.sort((a,b)=>b.t-a.t||ord[a.ty]-ord[b.ty]);
 return out;
}
const EVT={
 arr: r=>['ARRIVED', r.nm+' on site',       'route '+r.id+' · wave '+r.wave+(r.cls==='lg'?' · oversize':''), 'n'],
 roll:r=>['STAGED',  'Cart '+r.id+' → '+r.slot,'sorted '+hm(r.ready)+' · driver due '+hm(r.arr),            'b'],
 in:  r=>['SCAN IN', r.nm+' → '+r.slot,     'waited '+Math.max(0,Math.round(r.scanIn-r.arr))+' min for the slot','g'],
 out: r=>['CLEARED', r.slot+' open',        r.nm+' departed · '+Math.round(r.scanOut-r.scanIn)+' min in slot','o']};

/* ================= WALKTHROUGH =================
   Eight steps built from the real schedule, not hardcoded times. Each one moves the clock,
   picks the driver and slot being discussed, and says what to look at. */
let TOUR=-1, TOURC=null, TOURBACK=null;
function tourSteps(){
 if(TOURC)return TOURC;
 const k='C', S=sch(k);
 /* a clean representative: standard vehicle, not first time, no device fault,
    and their cart reached the position before they did */
 const cand=S.live.filter(r=>!r.first&&!r.conn&&!r.vmis&&r.slot&&r.roll<r.arr&&r.wave===1)
   .sort((a,b)=>a.scanIn-b.scanIn);
 const d=cand[Math.floor(cand.length/2)]||S.live.find(r=>r.slot)||S.live[0];
 /* the worst squeeze of the shift */
 let worst={t:WAVES[0].t,gap:-99};
 for(let t=SORTW.e;t<=WAVES[2].t;t+=2){const f=forecast(k,t); if(f.gap>worst.gap)worst={t,gap:f.gap}}
 /* a building with no dedicated oversize lane, and a position it is blocking */
 const ok='G', SG=sch(ok);
 const ovr=SG.live.filter(r=>r.pen>0&&r.slot).sort((a,b)=>a.scanIn-b.scanIn);
 const ov=ovr[Math.floor(ovr.length/2)]||ovr[0];

 TOURC=[
 {k:'C',t:SORTW.s+140,foc:'queues',slot:null,ph:null,
  h:'Sort is still running',
  s:'Nothing is staged yet. A cart cannot move to a position until its route closes clean, so every open lane is waiting on the sort line, not on space.'},
 {k:'C',t:d.roll,foc:'lanes',slot:d.slot,ph:d.id,
  h:'The first carts roll',
  s:'Sort finishes a route and the engine decides which cart moves next. Not the one that finished first, the one whose driver is due first. Cart '+d.id+' goes to '+d.slot+' at '+hm(d.roll)+', '+Math.round(d.arr-d.roll)+' minutes before the driver gets here.'},
 {k:'C',t:Math.max(d.roll+1,d.arr-8),foc:'phones',slot:d.slot,ph:d.id,
  h:'The driver hits the geofence',
  s:d.nm+' is minutes from the gate. The cart is already in '+d.slot+'. Their app tells them where to pull in before they arrive, so nobody is standing at a rack waiting to be told.'},
 {k:'C',t:d.scanIn,foc:'phones',slot:d.slot,ph:d.id,
  h:'They pull into the slot and scan in',
  s:'No radio call. The slot number is on the phone, the cart is already there, and the handheld told the runner to put it there. Two screens, one number, issued by the system.'},
 {k:'C',t:Math.min(d.scanOut-1,d.scanIn+Math.max(2,Math.round((d.scanOut-d.scanIn)/2))),foc:'lanes',slot:d.slot,ph:d.id,
  h:'Loading',
  s:'The board shows the vehicle in the position with a clock against it. A supervisor can see who is running long from the office instead of walking the floor to find out.'},
 {k:'C',t:d.scanOut+1,foc:'feed',slot:d.slot,ph:d.id,
  h:'They scan out and the position releases itself',
  s:d.slot+' cleared at '+hm(d.scanOut)+' after '+Math.round(d.scanOut-d.scanIn)+' minutes. Nobody marks it free. The next cart in the queue rolls in behind them and the cycle repeats.'},
 {k:'C',t:worst.t,foc:'squeeze',slot:null,ph:null,
  h:'When there are more drivers than positions',
  s:'This is the moment the floor normally discovers by watching a queue build. The engine sees it twelve minutes out from the geofence and names the specific carts to pull back, with the share of the gap each move closes.'},
 {k:ok,t:ov?ov.scanIn+2:WAVES[1].t,foc:'lanes',slot:ov?ov.slot:null,ph:ov?ov.id:null,
  h:'Why the oversize lane is a standard, not a preference',
  s:'Orlando has no dedicated oversize lane. '+(ov?'Route '+ov.id+' needs a cargo van, so it takes a standard position in '+ov.slot+' and holds the one next to it. ':'')+
    'The hatched cell is a position that exists on paper and cannot be used. That is why the lane build is in the standard.'}];
 TOURC=tourOrder(TOURC);
 if(SEATS[SEAT].lock) TOURC=TOURC.filter(x=>x.k===SEATS[SEAT].lock);
 return TOURC;
}
function tourOrder(a){                      /* first and last are fixed; the middle follows the clock */
 const head=a[0], tail=a[a.length-1], mid=a.slice(1,-1).sort((x,y)=>x.t-y.t);
 return [head].concat(mid,[tail]);
}

/* ================= 7 DAY PLAN + NETWORK BENCHMARK ================= */
const DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* day of week curve straight from the workbook, normalised to 7.0 */
const SHAPE={Mon:NETD.shape[0],Tue:NETD.shape[1],Wed:NETD.shape[2],Thu:NETD.shape[3],Fri:NETD.shape[4],Sat:NETD.shape[5],Sun:NETD.shape[6]};
const PV={}, PI={}, SUPH={}, PRSN={}, SUBMITTED={}; let PUSHED=null;        /* site overrides: volume, indirect, uph, reason */
let PLANVIEW='site';
function setPlanView(v){PLANVIEW=v;draw()}

function planDays(){const out=[],n=new Date();
 for(let i=1;i<=7;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);
  out.push({i:i-1,dow:DOWN[d.getDay()],lbl:(d.getMonth()+1)+'/'+d.getDate()})}
 return out}
/* the workbook day of week curve, normalised so a week sums to seven days of volume */
function baseVol(k,day){return Math.round(MK[k].vol*SHAPE[day.dow])}
function dayVol(k,d){return (PV[k]&&PV[k][d.i]!==undefined)?PV[k][d.i]:baseVol(k,d)}
function setVol(k,i,v){PV[k]=PV[k]||{};PV[k][i]=Math.max(0,Math.round(+v||0));draw()}
function setDayInd(k,i,v){PI[k]=PI[k]||{};PI[k][i]=Math.max(0,Math.round((+v||0)*10)/10);draw()}
function setSiteUph(k,v){SUPH[k]=Math.max(40,Math.min(220,+v||0));draw()}
function setPRsn(k,v){PRSN[k]=v;draw()}
function resetSite(k){delete PV[k];delete PI[k];delete SUPH[k];delete PRSN[k];delete SUBMITTED[k];draw()}
function submitPlan(k){SUBMITTED[k]=T;draw()}
function pushBar(){PUSHED=T;draw()}

/* ================= LABOR: INDIRECT AS A SHARE OF HOURS =================
   Finance allocates indirect as a percentage of total paid hours, so that is the unit.
   Direct hours are the hours that move packages. Everything else is indirect.
   The question the plan answers is where the network is paying for hours it is not getting. */
/* ================= LABOR =================
   The workbook carries actual hours and standard hours for every market. The gap between
   them is the labor number and it needs no assumptions. The buckets further down are a
   model that explains where the gap went; they are labelled as a model on screen. */
const RATE=24.50;
const WKS=['Wk 25','Wk 26','Wk 27','Wk 28','Wk 29','Wk 30'];
function labor(k){
 const d=DS[k], act=d.hrs_day, std=d.std_day, v=act-std;
 return {act, std, varH:v, pct:100*v/std, wk:v*7, cost:v*7*RATE,
  uph:d.uph, uphStd:Math.round(d.vol/std*10)/10, over:v>0};
}
function netLabor(list){
 const a=list.reduce((x,m)=>x+labor(m.k).act,0), s=list.reduce((x,m)=>x+labor(m.k).std,0);
 const over=list.filter(m=>labor(m.k).over);
 const oh=over.reduce((x,m)=>x+labor(m.k).varH,0);
 return {act:a, std:s, varH:a-s, pct:100*(a-s)/s, wk:(a-s)*7, cost:(a-s)*7*RATE,
  overH:oh, overWk:oh*7, overCost:oh*7*RATE, overN:over.length,
  perK:oh*7*RATE/(list.reduce((x,m)=>x+m.vol,0)*7/1000)};   /* dollars per 1,000 packages */
}
/* ---- where the gap went. This is a model, not a measurement. ---- */
const IBK=[
 ['Rework and reprocessing',      d=>d.vol*d.rework/100*0.28/60, 'units touched twice, assumed 0.28 min each'],
 ['Undelivered package handling', d=>d.aband/1e4*d.vol*0.80/60,  'packages that came back, assumed 0.8 min each'],
 ['Handling defect correction',   d=>d.hand/1e4*d.vol*3.0/60,    'mis-stows and damage, assumed 3 min each'],
 ['Idle on late freight',         d=>d.arr_late/100*d.hrs_day*0.35,'floor with no work to build'],
 ['Driver support at the desk',   d=>Math.round(d.vol/90)*Math.max(0,d.ci_med-6)*0.12/60,'supervisor time on waiting drivers']];
function buckets(k){const d=DS[k], o={};
 IBK.forEach(b=>o[b[0]]=Math.round(b[1](d)*10)/10);
 o._tot=Math.round(IBK.reduce((a,b)=>a+o[b[0]],0)*10)/10;
 return o}

/* ---- the benchmark, from the six real weeks in the workbook ---- */
function siteWeeks(k){return DS[k].wk_uph.map((u,i)=>({w:WKS[i],uph:u}))}
function netBench(){
 const tot=MKT.reduce((a,m)=>a+m.vol,0);
 const wk=WKS.map((w,i)=>({w, uph:Math.round(MKT.reduce((a,m)=>a+DS[m.k].wk_uph[i]*m.vol,0)/tot*10)/10}));
 const cur=wk[wk.length-1], prev=wk[wk.length-2], first=wk[0];
 return {wk, cur, prev, first, std:NETD.uph_std,
  actual:Math.round(NETD.pkgs/NETD.hours*10)/10,
  dUph:Math.round((cur.uph-prev.uph)*10)/10,
  drift:Math.round((cur.uph-first.uph)*10)/10};
}
function siteVar(k){const w=siteWeeks(k), cur=w[w.length-1].uph, B=netBench(), L=labor(k);
 return {cur, first:w[0].uph, drift:Math.round((cur-w[0].uph)*10)/10,
  vsNet:Math.round((cur-B.cur.uph)*10)/10, vsStd:Math.round((cur-B.std)*10)/10, L}}

function sheet(k){
 const uph=SUPH[k]||DS[k].uph, std=NETD.uph_std, D=planDays();
 /* total hours = volume / UPH, the same definition the workbook uses.
    Standard hours = volume / the network standard. The gap is the variance. */
 const rows=D.map(d=>{const v=dayVol(k,d), tot=v/uph, sh=v/std;
  const ind=(PI[k]&&PI[k][d.i]!==undefined)?PI[k][d.i]:Math.round((tot-sh)*10)/10;
  return {d,v,uph,tot,sh,varH:tot-sh,ind,pct:tot?100*(tot-sh)/tot:0}});
 const t=f=>rows.reduce((a,r)=>a+r[f],0);
 return {rows,uph,std,vol:t('v'),tot:t('tot'),sh:t('sh'),varH:t('varH'),
  pct:t('tot')?100*t('varH')/t('tot'):0, edited:!!(PV[k]||PI[k]||SUPH[k])};
}

 wa:true, role:SEATS[SEAT].lock?'Launch Supervisor':ROLES[0], note:'', made:null, sopOnly:false};draw()}

 NEWT[f]=(f==='routes')?Math.max(1,Math.min(MK[SEL].rt,Math.round(+v||1)))

  team:kd.team, raisedTeam:kd.team, ok:true, p, sla, t:T,
  sopDone: site?(escalated?T:T+18):T, escd: site?!!escalated:false,

 USERTIX.push(x);
 if(site&&escalated){TOVR[x.id]={sop:'escalated',sopT:T}}
 return x;
}

/* ================= NOC · queue and SOP hub ================= */
let TSEL=null, TFT='all', TFP='all', TFS='open', TFM='all', NOCVIEW='noc';
let IK='trailer', IR=6, IW=true, SSEL=null;
function tpick(id){TSEL=(TSEL===id)?null:id;draw()}
function spick(id){SSEL=(SSEL===id)?null:id;draw()}
function tfilt(f,v){if(f==='t')TFT=v;if(f==='p')TFP=v;if(f==='s')TFS=v;if(f==='m')TFM=v;TSEL=null;draw()}
function tclear(){TFT='all';TFP='all';TFS='open';TFM='all';draw()}
function setNocView(v){NOCVIEW=v;TSEL=null;SSEL=null;draw()}
function setIK(v){IK=v;draw()} function setIR(v){IR=Math.max(1,Math.min(MK[SEL].rt,Math.round(+v||1)));draw()}
function setIW(v){IW=v;draw()}
function pchip(p){return '<span class="pr p'+p+'">P'+p+'</span>'}

function tqueue(){
 return allTix().filter(x=>{
  if(!inNoc(x,T))return false;
  const st=tstate(x,T), v=tx(x);
  if(TFS==='open'&&st==='resolved')return false;
  if(TFS==='new'&&st!=='new')return false;
  if(TFS==='resolved'&&st!=='resolved')return false;
  if(TFS==='breach'&&(!tbreach(x,T)||st==='resolved'))return false;
  if(TFT!=='all'&&v.team!==TFT)return false;
  if(TFP!=='all'&&v.p!==+TFP)return false;
  if(TFM!=='all'&&x.mk!==TFM)return false;
  return true}).sort((a,b)=>tx(a).p-tx(b).p||nocT(a)-nocT(b));
}
function squeue(){
 return allTix().filter(x=>x.own==='site'&&sstate(x,T)!=='future'&&(TFM==='all'||x.mk===TFM))
  .sort((a,b)=>{const o={open:0,escalated:1,resolved:2};return o[sstate(a,T)]-o[sstate(b,T)]||b.t-a.t});
}
function vNoc(){
 const A=allTix().filter(x=>x.t<=T);
 const site=A.filter(x=>x.own==='site');
 const onSite=site.filter(x=>sstate(x,T)==='resolved').length;
 const esc=site.filter(x=>sstate(x,T)==='escalated').length;
 const working=site.filter(x=>sstate(x,T)==='open').length;
 const defl=site.length?Math.round(100*onSite/Math.max(1,onSite+esc)):0;
 return hdr('NOC','Only what leaves the building. Everything fixable before the next wave goes to the SOP hub')+
 vNew()+
 '<div class="act" style="margin-bottom:12px">'+
  '<button class="abtn p" onclick="openNew()">Raise a ticket</button>'+
  '<div class="seg"><button class="'+(NOCVIEW==='noc'?'on':'')+'" onclick="setNocView(\'noc\')">NOC queue</button>'+
  '<button class="'+(NOCVIEW==='sop'?'on':'')+'" onclick="setNocView(\'sop\')">SOP hub</button></div>'+
  '<span style="font-size:11.5px;color:var(--ink3)">'+A.length+' raised today · '+
   '<b style="color:var(--mint-d)">'+onSite+' closed on site</b> · '+esc+' escalated after the SOP · '+
   A.filter(x=>x.own==='central').length+' straight to the NOC</span>'+
 '</div>'+
 (NOCVIEW==='noc'?vNocQ(defl,onSite,working):vSopHub(defl,onSite,esc,working));
}

function vNocQ(defl,onSite,working){
 const inq=allTix().filter(x=>inNoc(x,T));
 const open=inq.filter(x=>tstate(x,T)!=='resolved');
 const p1=open.filter(x=>tx(x).p===1).length, br=open.filter(x=>tbreach(x,T)).length;
 const nw=inq.filter(x=>tstate(x,T)==='new').length, rs=inq.filter(x=>tstate(x,T)==='resolved').length;
 const wrong=open.filter(x=>!x.ok).length;
 const q=tqueue(), sel=TSEL?allTix().find(x=>x.id===TSEL):null;
 const byTeam={}; TEAMS.forEach(t=>byTeam[t]=open.filter(x=>tx(x).team===t).length);
 return '<div class="grid g6" style="margin-bottom:12px">'+
  tile('Open',open.length,'that Central Ops owns')+

/* ================= NETWORK KPIs =================
   OTD is not an input. It falls out of how launch and sort actually ran. */
const GEOWIN=12;                       /* geofence: minutes out from the gate */
function inbound(k,t){const S=sch(k);
 return S.live.filter(r=>r.cin<=t&&r.arr>t&&r.arr<=t+GEOWIN)}
function forecast(k,t,win){
 win=win||GEOWIN;
 const B=board(k,t), sup={std:0,lg:0}, dem={std:0,lg:0}, frees=[];
 B.slots.forEach(x=>{
  if(x.st==='empty'){sup[x.cls]++;return}
  if((x.st==='staged'||x.st==='loading')&&x.r&&x.r.scanOut<=t+win){sup[x.cls]++;frees.push(x)}
 });
 const arr=inbound(k,t);
 arr.forEach(r=>dem[r.cls]++);
 B.waiting.forEach(r=>dem[r.cls]++);
 /* staged carts sitting on a position whose driver is still a long way out */
 const parked=B.slots.filter(x=>x.st==='staged'&&x.r&&x.r.arr>t+win)
  .sort((a,b)=>a.r.arr-b.r.arr).reverse();
 return {sup,dem,win,arr,frees,parked,
  gStd:dem.std-sup.std, gLg:dem.lg-sup.lg,
  gap:(dem.std-sup.std)+(dem.lg-sup.lg)};
}
function spark(a,w,h){
 const mn=Math.min.apply(null,a), mx=Math.max.apply(null,a), r=Math.max(.1,mx-mn);
 const pts=a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+','+(h-((v-mn)/r)*h).toFixed(1)).join(' ');
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="vertical-align:-2px">'+
  '<polyline points="'+pts+'" fill="none" stroke="'+(a[a.length-1]>=a[0]?'var(--mint-d)':'var(--coral)')+'" stroke-width="1.4"/></svg>';
}

let FTYPE='all', FSITE='all', HQ=0, LOOK='7d';
const LOOKS=[['day','Last week &middot; Wk 30'],['7d','6 week average']];
function setFType(v){FTYPE=v;draw()} function setFSite(v){FSITE=v;draw()}
function setLook(v){LOOK=v;draw()}  function setHQ(i){HQ=i;draw()}
function clearF(){FTYPE='all';FSITE='all';draw()}

/* the same measures over three windows. A single day swings, a month barely moves. */
function look(k){
 const d=DS[k], w=d.wk_otd, R=rng(MK[k].seed*17+(LOOK==='day'?1:LOOK==='7d'?2:3));
 const j=(b,a)=>Math.round(b*(1+(R()-.5)*a)*100)/100;
 const fin=o=>{o.hours=Math.round(o.vol/o.uph*10)/10; return o};   /* hours follow from volume and UPH */
 if(LOOK!=='day'){const m=w.reduce((a,b)=>a+b,0)/w.length;   /* the real six week mean */
  return fin({otd:Math.round(m*100)/100,uph:d.uph,rework:d.rework,ci:d.ci_med,
   aband:d.aband,hand:d.hand,late:d.arr_late,raband:d.raband,vol:d.vol,wk:w})}
 /* a single week: that market's own last week, no invented noise */
 return fin({otd:w[w.length-1],uph:d.wk_uph[d.wk_uph.length-1],rework:d.rework,ci:d.ci_med,
  aband:d.aband,hand:d.hand,late:d.arr_late,raband:d.raband,vol:d.vol,wk:w});
}
function netLook(list){const v=list.reduce((a,m)=>a+look(m.k).vol,0);
 const h=list.reduce((a,m)=>a+look(m.k).hours,0);
 const w=f=>list.reduce((a,m)=>a+look(m.k)[f]*look(m.k).vol,0)/v;
 /* UPH for a group is total packages over total hours, not the mean of the members' rates */
 return {vol:v,hours:h,uph:h?v/h:0,otd:w('otd'),rework:w('rework'),ci:w('ci'),aband:w('aband'),
  hand:w('hand'),late:w('late'),raband:w('raband')};
}
/* against the engineered standard from the workbook, not the mean of these same eight */
function attain(k){const a=look(k).uph, p=NETD.uph_std, pct=100*a/p;
 return {a,p,pct,band:pct>=102?'over':pct>=98?'at':'under'}}

function wxRisk(){
 const hit=WXRISK.filter(f=>f.lvl!=='clear'&&f.type==='Market');
 const hubs=WXRISK.filter(f=>f.lvl!=='clear'&&f.type==='Hub');
 const rows=hit.map(f=>{const m=MK[f.id], cut=f.lvl==='act'?.28:.12;
  return {m, ev:f.why, lvl:f.lvl, risk:Math.round(m.vol*cut), otd:(cut*100*.42).toFixed(1)}});
 rows.sort((a,b)=>b.risk-a.risk);
 return {rows, hubs, exposed:rows.reduce((a,r)=>a+r.risk,0), scanned:WXRISK.length};
}
function vWx(){
 const W=wxRisk();
 if(!WXRISK.length) return '<div class="ai" style="height:100%"><div class="aih"><span class="aid">v</span>WEATHER RISK</div>'+
  '<div class="fb">Reading National Weather Service alert polygons against '+MKT.length+' markets and 4 origin hubs.</div></div>';
 if(!W.rows.length&&!W.hubs.length) return '<div class="ai" style="height:100%"><div class="aih"><span class="aid">v</span>WEATHER RISK</div>'+
  '<div class="find"><span class="fv ok">ALL CLEAR</span><div class="ft">'+W.scanned+' of '+W.scanned+' sites clear</div>'+
  '<div class="fb">No active National Weather Service warning touches a market or an origin hub. Radar is live and the check reruns on every refresh.</div></div>'+
  '<div class="find"><div class="ft">What would change this</div><div class="fb">A severe or extreme polygon over a market would put roughly 28% of that day&rsquo;s volume at risk and cost about 12 points of on-time. Both figures are assumptions, not fitted to history, because the workbook has no weather field. Over a hub it exposes every destination on that lane, not just the city under the cell.</div></div></div>';
 return '<div class="ai" style="height:100%"><div class="aih"><span class="aid">v</span>WEATHER RISK'+
  '<span style="margin-left:auto;color:#8B857C;text-transform:none;letter-spacing:0;font-weight:400">'+W.rows.length+' market'+(W.rows.length===1?'':'s')+' exposed</span></div>'+
  '<div class="find"><span class="fv no">'+fm(W.exposed)+' PACKAGES AT RISK</span>'+
   '<div class="ft">'+W.rows.map(r=>r.m.n).join(', ')+'</div>'+
   '<div class="fb">'+W.rows.map(r=>'<b>'+r.m.n+'</b> · '+r.ev+' · about '+fm(r.risk)+' packages and '+r.otd+' points of on-time.').join('<br>')+'<div style="font-size:10.5px;color:#8B857C;margin-top:7px">Alerts and radar are live from the National Weather Service. The exposure percentages are assumptions, not fitted to history: there is no weather field in the workbook, so instrumenting it is a prerequisite for calibrating this.</div></div>'+
  (W.hubs.length?'<div class="find"><span class="fv up">HUB EXPOSED</span><div class="ft">'+W.hubs.map(h=>h.name).join(', ')+'</div>'+
   '<div class="fb">Every destination on that lane is exposed, not just the city under the cell. Pull departures forward before the wave, not after.</div></div>':'')+
  '<div class="find"><div class="ft">Recommended</div><div class="fb">Hold launch 30 minutes at the affected markets and shrink route plans before staging. Tell Marketplace now so pay can move while drivers are still deciding.</div></div></div>';
}

const HOMEQ=[
 ['Which sites are under the standard?', ()=>{const u=fmkts().map(m=>({m,A:attain(m.k)})).filter(x=>x.A.band==='under').sort((a,b)=>a.A.pct-b.A.pct);
   return u.length? u.map(x=>'<b>'+x.m.n+'</b> running '+f1(x.A.a)+' against the '+f1(x.A.p)+' standard, '+f1(x.A.pct-100)+'%').join('<br>')+'<br><br>The standard is engineered, from the workbook. It does not move when the network moves.'
    : 'Every site in view is at or above the standard.'}],
 ['Where are we over standard on labor?', ()=>{const r=fmkts().map(m=>({m,L:labor(m.k)})).filter(x=>x.L.over).sort((a,b)=>b.L.cost-a.L.cost);
   const N=netLabor(fmkts());
   return r.length? '<b>$'+fm(N.overCost)+' a week</b> across '+N.overN+' markets running above their standard hours.<br>'+
     r.map(x=>'<b>'+x.m.n+'</b> '+(x.L.pct>=0?'+':'')+f1(x.L.pct)+'% · $'+fm(x.L.cost)+' a week').join('<br>')+
     '<br><br>Both hour columns are workbook figures, so this needs no assumptions.'
    : 'Every site in view is at or under its standard hours.'}],
 ['3PL or Veho, who runs better?', ()=>{const g=t=>{const s=MKT.filter(m=>m.fac===t), v=s.reduce((a,m)=>a+look(m.k).vol,0);
     return {n:s.length, otd:s.reduce((a,m)=>a+look(m.k).otd*look(m.k).vol,0)/v,
             uph:s.reduce((a,m)=>a+look(m.k).uph*look(m.k).vol,0)/v}};
   const v=g('Veho'), p=g('3PL');
   return '<b>Veho</b> ('+v.n+' sites) · '+f1(v.otd)+'% OTD · '+f1(v.uph)+' UPH<br>'+
    '<b>3PL</b> ('+p.n+' sites) · '+f1(p.otd)+'% OTD · '+f1(p.uph)+' UPH<br><br>'+
    (v.otd>p.otd?'Veho is '+f1(v.otd-p.otd)+' points better on time':'3PL is '+f1(p.otd-v.otd)+' points better on time')+'.'}],
 ['What is sequencing worth?', ()=>{const F=fmkts();
   const s=F.reduce((a,m)=>a+Math.max(0,unsequenced(m.k).waitMin-sch(m.k).waitMin),0);
   const rt=F.reduce((a,m)=>a+Math.round(m.vol/90),0);
   const real=F.reduce((a,m)=>a+Math.round(m.vol/90)*DS[m.k].ci_med,0)/60;
   return '<b>Simulated.</b> The engine against unsequenced rollover is <b>'+f1(s/60)+' hours</b> a day of driver waiting across '+F.length+' site'+(F.length===1?'':'s')+'.<br><br>'+'The measured prize is bigger. Check-in to load in the workbook runs '+f1(netLook(F).ci)+' minutes median across '+fm(rt)+' routes a day, which is <b>'+fm(real)+' driver hours a day</b>. That is the number worth chasing.'}],
 ['Is the network improving?', ()=>{const N=netBench();
   return 'Standard is <b>'+f1(N.std)+' UPH</b>. The network ran <b>'+f1(N.actual)+'</b> across six weeks.<br>'+
    N.first.w+' '+f1(N.first.uph)+' → '+N.cur.w+' '+f1(N.cur.uph)+', a move of <b>'+(N.drift>=0?'+':'')+f1(N.drift)+'</b>.<br><br>'+
    'It is flat. Nothing here is closing on its own.'}]];

  '<span class="fl" style="margin-left:auto">'+fm(K.vol)+' packages a day · '+fm(K.hours)+' paid hours a day</span></div>'+
 '<div class="kpis">'+
  '<div class="kpi"><div class="kl">On-time delivery</div><div class="kv '+(K.otd<93?'r':K.otd<95?'a':'g')+'">'+f1(K.otd)+'%</div><div class="kd">'+lbl.toLowerCase()+', volume weighted</div></div>'+

  '<div class="kpi"><div class="kl">Cost of the gap</div><div class="kv '+(O.overCost>3000?'r':'a')+'">$'+fm(O.overCost)+'</div><div class="kd">a week, markets over standard</div></div>'+
  '<div class="kpi"><div class="kl">Weather exposure</div><div class="kv g" id="wxN">0</div><div class="kd" id="wxL">checking</div></div>'+
 '</div>'+
 '<div class="mapwrap">'+

   '<div id="mapslot" style="height:428px;width:100%"></div></div>'+
  '<div id="wxPanel2">'+vWx()+'</div>'+
 '</div>'+
 '<div class="card mt12"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px">'+

  sorted.map(r=>{
   const off=Math.max(-span,Math.min(span,r.A.pct-100)), h=Math.abs(off)/span*88;
   const cl=r.A.band==='over'?'over':r.A.band==='under'?'under':'at';
   return '<div class="vcol" onclick="pick(\''+r.m.k+'\');go(\'plan\')">'+
    '<div class="vbox">'+
     '<i class="vbar '+cl+'" style="height:'+Math.max(2,h)+'px"></i>'+

      (off>=0?'+':'')+f1(r.A.pct-100)+'%</span>'+

 '<h2>Every market <span>'+lbl+(FTYPE!=='all'||FSITE!=='all'?', filtered':'')+' &middot; every column is a workbook figure</span> <span class="tag meas">MEASURED</span></h2>'+
 '<div class="tscroll"><table class="wide"><thead><tr>'+
  '<th>Market</th><th>Region</th><th>Type</th><th>Volume / day</th><th>On-time delivery</th><th>6 week OTD</th>'+

 rows.sort((x,y)=>x.L.otd-y.L.otd).map(r=>

 '<tr class="tot"><td>Network</td><td></td><td></td><td>'+fm(K.vol)+'</td><td>'+f1(K.otd)+'%</td><td></td>'+
  '<td>'+f1(K.uph)+'</td><td>'+f1(K.hours)+'</td><td>'+(O.pct>=0?'+':'')+f1(O.pct)+'%</td><td>'+f1(K.rework)+'%</td>'+

 '<div class="legend"><b>Not delivered</b> packages that came back instead of reaching the customer, as a share of volume. '+

}

/* the v-logo panel runs the same questions as the Home widget */
function drawAsk(){
 setHt('askchips',HOMEQ.map((q,i)=>'<button class="mk" style="background:'+(HQ===i?'var(--coral)':'#2A2723')+';border-color:'+(HQ===i?'var(--coral)':'#3A3733')+';color:'+(HQ===i?'#fff':'#B5AFA6')+'" onclick="askGo('+i+')">'+q[0]+'</button>').join(''));
 setHt('askout','<div style="color:#8B857C;font-size:11px;margin-bottom:6px">'+HOMEQ[HQ][0]+'</div>'+HOMEQ[HQ][1]());
}
function askGo(i){HQ=i;drawAsk();if(SCR==='home')draw()}

/* ================= router ================= */
function draw(){
 const S_=SEATS[SEAT], s=summ(SEL,T);
 setTx('seatname',S_.n); setTx('seatw',S_.who+' · '+S_.dept); setTx('seatav',S_.av);
 setHt('viewpick','<div class="vh">VIEW AS</div>'+Object.keys(SEATS).map(x=>
  '<button class="'+(x===SEAT?'on':'')+'" onclick="setSeat(\''+x+'\');document.getElementById(\'viewpick\').classList.remove(\'open\')">'+
  SEATS[x].n+'<i>'+SEATS[x].dept+'</i></button>').join(''));
 const bdg={home:0,sort:s.board.due,plan:0,noc:allTix().filter(x=>inNoc(x,T)&&tstate(x,T)!=='resolved').length};
 if(!S_.tabs.includes(SCR))SCR=S_.tabs[0];
 setHt('nav1',NAV.filter(n=>S_.tabs.includes(n[0])).map(n=>
  '<a href="javascript:void(0)" class="'+(SCR===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+
  '<span class="ic">'+n[2]+'</span>'+n[1]+
  (bdg[n[0]]?'<span class="ct">'+bdg[n[0]]+'</span>':'')+'</a>').join(''));
 let h='';
 if(SCR==='home')h=vHome();
 else if(SCR==='sort')h=vStage()+vPhones();
 else if(SCR==='plan')h=vPlan();
 else if(SCR==='noc')h=vNoc();
 setHt('body',h);
 if(SCR==='home'){
  const host=mapHost();
  let live=false; try{live=!!(MAP&&host&&MAP.getContainer()===host&&host.isConnected)}catch(e){live=false}
  if(!live) initMap();
  else setTimeout(()=>{try{MAP.invalidateSize(false)}catch(e){}},60);
 }
 if(ASK)drawAsk();
}
boot();
